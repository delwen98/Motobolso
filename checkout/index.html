<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MotoBolso PRO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://sdk.mercadopago.com/js/v2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#03070d;color:#f5f9ff;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;padding:18px}
.card{width:min(460px,100%);background:#08131f;border:1px solid rgba(100,180,255,.16);border-radius:24px;padding:28px 20px;box-shadow:0 20px 60px #0008}
.logo{text-align:center;font-weight:800;font-size:20px;margin-bottom:24px}.logo span{color:#51caff}
h1{text-align:center;font-size:25px;margin:0 0 8px}.sub{text-align:center;color:#8ca0b4;font-size:14px;line-height:1.5}.price{text-align:center;font-size:25px;font-weight:800;margin:18px 0}.price small{font-size:12px;color:#8ca0b4}
label{display:block;font-size:11px;font-weight:800;color:#8ca0b4;margin:18px 0 7px}input{width:100%;height:48px;border-radius:12px;border:1px solid #21405a;background:#07101a;color:#fff;padding:0 13px;font-size:15px;outline:none}input:focus{border-color:#51caff}
button{width:100%;height:50px;border:0;border-radius:13px;background:linear-gradient(135deg,#167cff,#37c1ff);font-weight:800;color:#00111c;margin-top:18px;font-size:15px}
#msg{margin-top:15px;padding:12px;border-radius:12px;background:#10202e;color:#b9d7ec;font-size:13px;line-height:1.45;display:none}.note{text-align:center;color:#62798d;font-size:11px;margin-top:18px}
</style>
</head>
<body>
<div class="card">
<div class="logo">Moto<span>Bolso</span></div>
<h1>MotoBolso PRO</h1>
<p class="sub">Controle financeiro completo para o seu corre.</p>
<div class="price">R$ 6,90 <small>/mês</small></div>
<label>E-MAIL</label>
<input id="email" type="email" autocomplete="email" placeholder="seu@email.com">
<div id="msg"></div>
<button id="pay">Continuar para pagamento</button>
<p class="note">Pagamento processado com segurança pelo Mercado Pago.</p>
</div>
<script>
const SUPABASE_URL='https://lrsuuxgufmgowrstqubs.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_LzDc9Xv33qMtA81Pzf8kpQ_k7D8W0uh';
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const msg=document.getElementById('msg');
function show(t){msg.textContent=t;msg.style.display='block'}
(async()=>{
 const {data,error}=await supabase.auth.getSession();
 if(error){show('Não foi possível verificar sua sessão.');return}
 if(!data.session){show('Entre no MotoBolso antes de continuar.');document.getElementById('pay').disabled=true;return}
 document.getElementById('email').value=data.session.user.email||'';
})();
document.getElementById('pay').onclick=async()=>{
 show('Preparando seu pagamento…');
 const {data,error}=await supabase.auth.getSession();
 if(error||!data.session?.access_token){show('Sua sessão expirou. Entre novamente no MotoBolso.');return}
 const email=document.getElementById('email').value.trim();
 if(!email){show('Informe seu e-mail.');return}
 show('O novo checkout será carregado pelo Mercado Pago.');
 window.location.href='https://www.mercadopago.com.br/checkout/v1/redirect';
};
</script>
</body>
</html>
