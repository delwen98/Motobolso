<!doctype html>
<html lang="pt-BR">
<head>

<meta name="theme-color" content="#03070d">

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#03070d;--card:#08131f;--line:rgba(100,180,255,.16);--text:#f5f9ff;--muted:#8ca0b4;--blue:#1682ff;--cyan:#51caff;--green:#3fe3ad;--d:'Space Grotesk',sans-serif;--b:'Manrope',sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,rgba(22,130,255,.18),transparent 38%),var(--bg);color:var(--text);font-family:var(--b);padding:22px 14px 42px;display:grid;place-items:center}.wrap{width:min(460px,100%)}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.brand{display:flex;align-items:center;gap:9px;font:700 1rem var(--d);text-decoration:none;color:var(--text)}.brand img{width:34px;height:34px;border-radius:10px}.brand em{font-style:normal;color:var(--cyan)}.back{color:var(--muted);font-size:.68rem;font-weight:800;text-decoration:none}.card{background:rgba(8,19,31,.92);border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 70px rgba(0,0,0,.32);padding:28px 22px;text-align:center}.icon{width:62px;height:62px;border-radius:19px;display:grid;place-items:center;margin:0 auto 16px;background:rgba(22,130,255,.1);border:1px solid rgba(81,202,255,.16);color:var(--cyan);font:800 1.4rem var(--d)}.eyebrow{color:var(--cyan);font-size:.58rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.title{font:700 1.7rem/1.05 var(--d);letter-spacing:-.045em;margin:8px 0 10px}.sub{color:var(--muted);font-size:.76rem;line-height:1.55;max-width:340px;margin:0 auto}.price{margin:18px 0 5px;font:700 1.45rem var(--d)}.price span{color:var(--muted);font:600 .68rem var(--b)}.note{color:#62798d;font-size:.62rem;line-height:1.5;margin:14px auto 0;max-width:330px}.btn{display:inline-flex;align-items:center;justify-content:center;margin-top:19px;min-height:48px;padding:0 19px;border-radius:13px;background:linear-gradient(135deg,#167cff,#37c1ff);color:#00111c;text-decoration:none;font-size:.76rem;font-weight:800}
</style>
</head>
<body><div class="wrap">
<div class="top"><a class="brand" href="../"><img src="../images/motobolso-app-icon.svg" alt=""><span>Moto<em>Bolso</em></span></a><a class="back" href="../">← Voltar</a></div>
<div class="card"><div class="icon">✓</div><div class="eyebrow">MotoBolso PRO</div><h1 class="title">Seu corre sob controle.</h1><p class="sub">Estamos finalizando nosso novo checkout de pagamentos. O acesso PRO continuará sendo liberado automaticamente após a confirmação da assinatura.</p><div class="price">R$ 6,90 <span>/mês</span></div><a class="btn" href="../">Voltar para o MotoBolso</a><p class="note">O pagamento ainda não está disponível durante o beta.</p></div>
</div></body></html>
