<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MotoBolso — Teste Mercado Pago</title>
<script src="https://sdk.mercadopago.com/js/v2"></script>
<style>
body{margin:0;background:#03070d;color:#f5f9ff;font-family:Arial,sans-serif;padding:20px}.box{max-width:520px;margin:auto;background:#08131f;border:1px solid #17314a;border-radius:20px;padding:22px}.warn{background:#2b1f05;border:1px solid #6d5312;padding:12px;border-radius:12px;font-size:13px;margin-bottom:18px}.field{margin-bottom:16px}label{display:block;font-size:12px;color:#8ca0b4;margin-bottom:7px}input{width:100%;box-sizing:border-box;height:46px;border-radius:10px;border:1px solid #29445d;background:#0b1723;color:#fff;padding:0 12px}.btn{margin-top:14px;width:100%;height:48px;border:0;border-radius:11px;background:#1682ff;color:#fff;font-weight:700}.status{margin-top:16px;padding:12px;border-radius:10px;background:#101d2a;white-space:pre-wrap;font-size:13px}small{color:#71879b}.title{margin-top:0}.hide{display:none}
</style>
</head>
<body><div class="box">
<h2 class="title">MotoBolso — Checkout de teste</h2>
<div class="warn">⚠️ Página descartável. Este checkout usa apenas credenciais de teste do Mercado Pago e não altera o checkout principal.</div>
<div class="field"><label>E-MAIL DE TESTE</label><input id="email" value="testuser123456789@testuser.com"></div>
<div id="brick"></div>
<div id="status" class="status">Carregando checkout de teste…</div>
<small>Cartão de teste Mastercard: 5480 8328 0103 3311 · CVV 123 · validade 11/30 · titular APRO · CPF 12345678909</small>
</div>
<script>
const MP_PUBLIC_KEY='APP_USR-4681b52e-99dd-4598-8d8f-28a9f6056ff7';
const TEST_FUNCTION='https://lrsuuxgufmgowrstqubs.supabase.co/functions/v1/mp-test';
const status=document.getElementById('status');
function msg(x){status.textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}
async function init(){
 try{
  const mp=new MercadoPago(MP_PUBLIC_KEY,{locale:'pt-BR'});
  const builder=mp.bricks();
  await builder.create('cardPayment','brick',{
   initialization:{amount:6.90,payer:{email:document.getElementById('email').value}},
   customization:{visual:{style:{theme:'dark'}}},
   callbacks:{
    onReady:()=>msg('Pronto. Use os dados de cartão de teste exibidos abaixo.'),
    onSubmit:async(formData)=>{
     msg('Enviando teste…');
     const r=await fetch(TEST_FUNCTION,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      email:document.getElementById('email').value.trim(),
      card_token:formData.token,
      payment_method_id:formData.payment_method_id,
      installments:Number(formData.installments||1)
     })});
     const data=await r.json().catch(()=>({}));
     msg(data);
     if(!r.ok) throw new Error(data?.message||data?.error||'Falha no teste');
     return;
    },
    onError:e=>{console.error(e);msg('Erro no Card Brick. Veja o console para detalhes.')}
   }
  });
 }catch(e){console.error(e);msg(e?.message||String(e))}
}
init();
</script>
</body></html>
